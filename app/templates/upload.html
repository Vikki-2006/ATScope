{% extends 'layouts/base.html' %}

{% block title %}Upload Resume - ResumeAI Enterprise{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
  
  <div class="pb-2 border-b border-slate-800">
    <h1 class="text-2xl font-bold text-white tracking-tight">Upload Candidate Resume</h1>
    <p class="text-xs text-slate-400 mt-0.5">Upload a PDF or DOCX file to extract candidate metadata, evaluate ATS structure, and compute readability indexes.</p>
  </div>

  <div class="ent-card p-8" x-data="fileUploader()">
    
    <!-- Drag and Drop Dropzone -->
    <div class="border-2 border-dashed border-slate-800 rounded-xl p-10 text-center transition-all cursor-pointer bg-slate-950/60 hover:border-blue-600/80"
         :class="{'border-blue-600 bg-blue-600/5': isDragging}"
         @dragover.prevent="isDragging = true"
         @dragleave.prevent="isDragging = false"
         @drop.prevent="handleDrop($event)"
         @click="$refs.fileInput.click()">
      
      <input type="file" x-ref="fileInput" class="hidden" accept=".pdf,.docx" @change="handleFileSelect($event)">

      <div class="w-12 h-12 rounded-lg bg-blue-600/10 text-blue-500 flex items-center justify-center mx-auto mb-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 0115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
      </div>

      <template x-if="!file">
        <div>
          <p class="text-sm font-semibold text-white mb-1">Click to browse or drag and drop file here</p>
          <p class="text-xs text-slate-500">Supports PDF and DOCX files up to 10MB</p>
        </div>
      </template>

      <!-- Selected File Card -->
      <template x-if="file">
        <div class="flex items-center justify-between p-3 rounded-lg bg-slate-900 border border-slate-800 text-left max-w-sm mx-auto" @click.stop>
          <div class="flex items-center space-x-3 overflow-hidden">
            <div class="p-1.5 rounded bg-blue-500/10 text-blue-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            </div>
            <div class="truncate">
              <p class="text-xs font-semibold text-white truncate" x-text="file.name"></p>
              <p class="text-[10px] text-slate-500" x-text="(file.size / (1024*1024)).toFixed(2) + ' MB'"></p>
            </div>
          </div>
          <button @click="file = null" type="button" class="text-slate-400 hover:text-rose-400 p-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
      </template>

    </div>

    <!-- Error Banner -->
    <template x-if="errorMessage">
      <div class="mt-4 p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs font-medium text-center" x-text="errorMessage"></div>
    </template>

    <!-- Upload Progress -->
    <template x-if="uploading">
      <div class="mt-6 space-y-2">
        <div class="flex justify-between text-xs text-slate-400">
          <span>Processing document & calculating scores...</span>
          <span x-text="progress + '%'"></span>
        </div>
        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
          <div class="bg-blue-600 h-full transition-all duration-300" :style="{ width: progress + '%' }"></div>
        </div>
      </div>
    </template>

    <!-- Submit Action -->
    <div class="mt-6 text-center" x-show="file && !uploading">
      <button @click="submitUpload()" type="button" class="btn-primary px-6 py-2.5 text-xs">
        Execute ATS Analysis
      </button>
    </div>

  </div>

</div>
{% endblock %}
