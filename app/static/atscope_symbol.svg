<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200' width='200' height='200'>
  <defs>
    <linearGradient id='cyanBlue' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#00D2FF' />
      <stop offset='50%' stop-color='#0072FF' />
      <stop offset='100%' stop-color='#003399' />
    </linearGradient>
    <linearGradient id='brightCyan' x1='0%' y1='100%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#00F2FE' />
      <stop offset='100%' stop-color='#4FACFE' />
    </linearGradient>
    <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='2' stdDeviation='3' flood-color='#00D2FF' flood-opacity='0.4'/>
    </filter>
  </defs>

  <!-- Left Main A Leg -->
  <path d='M 32 170 L 100 25 L 126 70 L 72 170 Z' fill='url(#cyanBlue)' />

  <!-- Right A Leg & Scope Integration -->
  <path d='M 100 25 L 168 170 L 132 170 L 88 80 Z' fill='url(#brightCyan)' opacity='0.9' />

  <!-- Dynamic S Curve Overlay -->
  <path d='M 50 120 C 70 80, 140 70, 130 110 C 120 145, 60 130, 80 170 C 95 190, 150 170, 160 150' 
        fill='none' stroke='url(#brightCyan)' stroke-width='22' stroke-linecap='round' filter='url(#glow)' />

  <!-- Scope Ring Dot -->
  <circle cx='140' cy='125' r='10' fill='#00F2FE' />
  <path d='M 140 105 A 20 20 0 0 1 160 125' fill='none' stroke='#00F2FE' stroke-width='5' stroke-linecap='round' />
</svg>