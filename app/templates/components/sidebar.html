<!-- Professional Enterprise Left Sidebar Navigation -->
<aside x-show="sidebarOpen"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="-translate-x-full"
       x-transition:enter-end="translate-x-0"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="translate-x-0"
       x-transition:leave-end="-translate-x-full"
       class="fixed top-0 left-0 bottom-0 z-40 w-64 ent-sidebar flex flex-col justify-between">
  
  <div class="p-4 space-y-6">
    <!-- Brand Logo -->
    <div class="flex items-center justify-between px-2 py-2">
      <a href="/dashboard" class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold shadow-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        </div>
        <div>
          <div class="font-bold text-sm tracking-tight leading-none" style="color:var(--text-primary)">AT<span class="text-blue-500">Scope</span></div>
          <div class="text-[10px] font-mono mt-0.5" style="color:var(--text-muted)">Enterprise v1.0</div>
        </div>
      </a>
      
      <button @click="toggleSidebar()" class="lg:hidden p-1" style="color:var(--text-muted)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Navigation Menu Section -->
    <div class="space-y-1">
      <div class="px-3 text-[10px] font-semibold uppercase tracking-wider mb-2" style="color:var(--text-muted)">Main Navigation</div>

      <a href="/dashboard" class="ent-nav-item {% if request.url.path == '/dashboard' %}active{% endif %}">
        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span>Dashboard</span>
      </a>

      <a href="/upload" class="ent-nav-item {% if request.url.path == '/upload' %}active{% endif %}">
        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 0115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
        <span>Upload Resume</span>
      </a>

      <a href="/job-match" class="ent-nav-item {% if request.url.path == '/job-match' %}active{% endif %}">
        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <span>Job Match</span>
      </a>

      <a href="/history" class="ent-nav-item {% if request.url.path == '/history' %}active{% endif %}">
        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>History</span>
      </a>

      <a href="/history" class="ent-nav-item">
        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span>Reports</span>
      </a>
    </div>

    <div class="space-y-1">
      <div class="px-3 text-[10px] font-semibold uppercase tracking-wider mb-2" style="color:var(--text-muted)">Account Management</div>

      <a href="/profile" class="ent-nav-item {% if request.url.path == '/profile' %}active{% endif %}">
        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span>Profile</span>
      </a>

      <a href="/settings" class="ent-nav-item {% if request.url.path == '/settings' %}active{% endif %}">
        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span>Settings</span>
      </a>
    </div>
  </div>

  <!-- User Account Card in Footer -->
  <div class="p-4" style="border-top:1px solid var(--border-color)">
    {% if user %}
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3 overflow-hidden">
          <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white text-xs font-bold">
            {{ user.full_name[0].upper() }}
          </div>
          <div class="truncate">
            <div class="text-xs font-semibold truncate" style="color:var(--text-primary)">{{ user.full_name }}</div>
            <div class="text-[10px] truncate" style="color:var(--text-muted)">{{ user.email }}</div>
          </div>
        </div>
        <button onclick="fetch('/api/v1/auth/logout', {method:'POST'}).then(() => window.location.href='/')"
                title="Sign Out" class="hover:text-rose-600 p-1" style="color:var(--text-muted)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        </button>
      </div>
    {% else %}
      <a href="/login" class="w-full py-2 px-3 block text-center rounded-lg bg-blue-600 text-white text-xs font-semibold hover:bg-blue-700">
        Sign In
      </a>
    {% endif %}
  </div>

</aside>
