{% extends 'layouts/base.html' %}

{% block title %}Reset Password - ResumeAI{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full glass-panel p-8 rounded-2xl border border-slate-800 shadow-2xl space-y-6"
       x-data="{ email: '', submitted: false }">
    
    <div class="text-center">
      <div class="w-12 h-12 rounded-xl gradient-bg flex items-center justify-center text-white font-bold mx-auto mb-4 shadow-lg">
        AI
      </div>
      <h2 class="text-2xl font-extrabold text-white">Reset Password</h2>
      <p class="text-sm text-slate-400 mt-1">Enter your account email to receive a password reset link</p>
    </div>

    <template x-if="submitted">
      <div class="p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-sm text-center">
        Password reset instructions have been sent to your email address.
      </div>
    </template>

    <form x-show="!submitted" class="space-y-4" @submit.prevent="
      submitted = true;
      Alpine.store('toast').show('Reset link sent to your email!', 'info');
    ">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Email Address</label>
        <input type="email" x-model="email" required placeholder="alex@example.com"
               class="w-full px-4 py-3 rounded-xl bg-slate-900/90 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 text-sm">
      </div>

      <button type="submit"
              class="w-full py-3 rounded-xl gradient-bg text-white font-bold text-sm shadow-lg shadow-indigo-500/25 hover:opacity-90 transition-opacity">
        Send Reset Link
      </button>
    </form>

    <div class="text-center text-xs text-slate-400">
      Remembered your password? <a href="/login" class="text-indigo-400 font-semibold hover:underline">Back to Login</a>
    </div>

  </div>
</div>
{% endblock %}
