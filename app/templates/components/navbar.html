<header class="ent-navbar sticky top-0 z-30">
  <div class="max-w-[1750px] mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-14">
      
      <!-- Left Controls: Sidebar Toggle & Search -->
      <div class="flex items-center space-x-4">
        {% if user %}
          <button id="sidebar-toggle" @click="toggleSidebar()" class="ent-navbar-ctrl">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>

          <div class="relative hidden sm:block w-64">
            <input id="navbar-search-input" type="text" placeholder="Search candidate records..."
                   class="ent-input w-full pl-9 pr-3 py-1.5 rounded-lg text-xs focus:outline-none focus:border-blue-600">
            <svg class="w-3.5 h-3.5 absolute left-3 top-2.5" style="color:var(--text-faint)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          </div>
        {% else %}
          <a id="navbar-brand-link" href="/" class="flex items-center space-x-2">
            <img src="/static/atscope_symbol.png" alt="ATScope Logo" class="h-8 w-auto object-contain">
            <span class="ent-brand-text font-bold text-lg">AT<span class="text-blue-500">Scope</span></span>
          </a>
        {% endif %}
      </div>

      <!-- Center Links for Logged Out Landing View -->
      {% if not user %}
        <nav class="hidden md:flex items-center space-x-8">
          <a id="navbar-features-link"    href="/#features"    class="ent-nav-link">Features</a>
          <a id="navbar-howitworks-link"  href="/#how-it-works" class="ent-nav-link">How It Works</a>
          <a id="navbar-faq-link"         href="/#faq"          class="ent-nav-link">FAQ</a>
        </nav>
      {% endif %}

      <!-- Right Controls -->
      <div class="flex items-center space-x-3">
        <!-- Theme Toggle -->
        <button id="theme-toggle" @click="toggleTheme()" class="ent-navbar-ctrl">
          <svg x-show="theme === 'dark'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg x-show="theme === 'light'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>

        {% if user %}
          <a id="navbar-newanalysis-btn" href="/upload" class="btn-primary px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            <span>New Analysis</span>
          </a>
        {% else %}
          <a id="navbar-login-link" href="/login" class="ent-signin-link px-3 py-1.5">Sign In</a>
          <a id="navbar-register-link" href="/register" class="btn-primary px-3 py-1.5 rounded-lg text-xs font-semibold">
            Get Started
          </a>
        {% endif %}
      </div>

    </div>
  </div>
</header>
